[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circ-audit"
version = "0.2.0"
description = "Circularity-Aware Audit Tool for Biomedical Prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Cui Lei", email = "cuilei@sj-hospital.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["circularity", "audit", "biomedical prediction", "knowledge leakage", "synthetic lethality"]

dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
xgboost = ["xgboost>=1.5"]
plotly = ["plotly>=5.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/cuilei-bib/circ-audit"
Documentation = "https://github.com/cuilei-bib/circ-audit#readme"
Repository = "https://github.com/cuilei-bib/circ-audit"
BugTracker = "https://github.com/cuilei-bib/circ-audit/issues"

[tool.setuptools.packages.find]
include = ["circ_audit_tool*"]

[tool.setuptools.package-data]
circ_audit_tool = ["framework/*.py"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_e2e.py"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
known_first_party = ["circ_audit_tool"]
